<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>營養素大亂鬥</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 1. 登入畫面 -->
    <div id="screen-login" class="screen active">
        <h1>🦠 營養素大亂鬥</h1>
        <div class="box">
            <h3>請輸入你的身分</h3>
            <select id="login-class">
                <option value="">選擇班別</option>
                <option value="1A">1A</option><option value="1B">1B</option>
                <option value="1C">1C</option><option value="1D">1D</option>
            </select>
            <input type="number" id="login-number" placeholder="輸入學號 (如: 15)">
            <button class="btn primary" onclick="login()">進入遊戲</button>
        </div>
    </div>

    <!-- 2. 主選單 -->
    <div id="screen-menu" class="screen">
        <h1 id="welcome-text">歡迎！</h1>
        <div class="menu-grid">
            <button class="btn boss" onclick="startSinglePlayer()">⚔️ 單人模式 (病魔保衛戰)</button>
            <button class="btn multi" onclick="alert('老師，單機雙人模式可於下階段擴充喔！')">👯 雙人對戰 (同機對抗)</button>
            <button class="btn info" onclick="showScreen('screen-revision'); loadRevision()">📖 溫習專區 (營養圖鑑)</button>
            <button class="btn rank" onclick="showScreen('screen-leaderboard'); loadLeaderboard()">🏆 榮譽榜</button>
        </div>
        <div id="teacher-entry" onclick="checkTeacher()">⚙️ 老師專區</div>
    </div>

    <!-- 3. 溫習專區 -->
    <div id="screen-revision" class="screen">
        <h2>📖 營養圖鑑</h2>
        <div id="revision-content" class="card-container"></div>
        <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
    </div>

    <!-- 4. 單人遊戲畫面 (升級版 Boss Rush) -->
    <div id="screen-single" class="screen" style="transition: background-color 0.2s;">
        <!-- 玩家狀態 -->
        <div class="box" style="width: 100%; max-width: 600px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                <span style="color: #e53935;">❤️ 你的血量: <span id="player-hp">500</span></span>
                <span style="color: #4CAF50;">⭐ 分數: <span id="player-score">0</span></span>
                <span style="color: #1976D2;">⏱️ 倒數: <span id="question-timer">10</span>s</span>
            </div>
            <h3 id="combo-text" style="color: #FF5722; display: none; margin: 5px 0 0 0;">🔥 連擊 x<span id="combo-count">0</span>! 傷害加倍!</h3>
        </div>

        <!-- 病魔狀態與題目區 -->
        <div class="box" style="width: 100%; max-width: 600px; background: #fff3e0; position: relative;" id="boss-container">
            <div style="text-align: center; margin-bottom: 15px;">
                <div id="boss-avatar" style="font-size: 4rem;">👾</div>
                <h3 style="margin: 5px 0; color: #673AB7;">病魔血量: <span id="boss-hp-text">1000</span></h3>
                <!-- 病魔血條 -->
                <div style="width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden;">
                    <div id="boss-hp-bar" style="width: 100%; height: 100%; background: #9C27B0; transition: width 0.3s ease-out;"></div>
                </div>
            </div>
            
            <h2 id="boss-question" style="font-size: 1.3rem;">準備好迎戰病魔了嗎？</h2>
            
            <div id="options-area" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <!-- 選項按鈕 -->
            </div>
        </div>
        <button class="btn back" onclick="forceEndGame()" style="margin-top: 15px;">放棄戰鬥</button>
    </div>

    <!-- 5. 榮譽榜 & 6. 老師專區 (保持不變) -->
    <div id="screen-leaderboard" class="screen">
        <h2>🏆 榮譽榜</h2>
        <div class="menu-grid" style="max-width: 800px; text-align: left;">
            <div class="box" style="width: 100%;"><h3>👑 本班前 10 名 (<span id="lb-class-name"></span>)</h3><ol id="class-leaderboard"></ol></div>
            <div class="box" style="width: 100%;"><h3>🌟 全級前 20 名</h3><ol id="grade-leaderboard"></ol></div>
        </div>
        <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
    </div>

    <div id="screen-teacher" class="screen">
        <h2>⚙️ 老師專區後台</h2>
        <div class="box">
            <p>點擊下方按鈕下載所有學生的遊玩紀錄 (Excel/CSV)。</p>
            <button class="btn primary" onclick="exportToCSV()">📊 下載紀錄</button>
            <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
