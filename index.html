<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>營養素大亂鬥 Nutrient Brawl</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- 🌟 神級套件 1: SweetAlert2 (華麗對話框) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 🌟 神級套件 2: Canvas Confetti (滿版粒子特效) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>
<body>

    <div id="screen-login" class="screen active">
        <h1 style="font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">🦠 營養素大亂鬥</h1>
        <div class="box">
            <h3>請輸入你的身分</h3>
            <select id="login-class">
                <option value="">選擇班別</option>
                <option value="1A">1A</option><option value="1B">1B</option>
                <option value="1C">1C</option><option value="1D">1D</option>
            </select>
            <input type="number" id="login-number" placeholder="輸入學號 (如: 15)">
            <button class="btn primary" onclick="login()">進入遊戲</button>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h1 id="welcome-text">歡迎！</h1>
        <div class="menu-grid">
            <button class="btn boss" onclick="startSinglePlayer()">⚔️ 單人模式 (病魔保衛戰)</button>
            <button class="btn multi" onclick="Swal.fire('開發中', '雙人對戰模式準備中！', 'info')">👯 雙人對戰 (同機對抗)</button>
            <button class="btn info" onclick="showScreen('screen-revision'); loadRevision()">📖 溫習專區 (營養圖鑑)</button>
            <button class="btn rank" onclick="showScreen('screen-leaderboard'); loadLeaderboard()">🏆 榮譽榜</button>
        </div>
        <div id="teacher-entry" onclick="checkTeacher()">⚙️ 老師專區</div>
    </div>

    <div id="screen-revision" class="screen">
        <h2>📖 營養圖鑑</h2>
        <div id="revision-content" class="card-container"></div>
        <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
    </div>

    <!-- 單人遊戲畫面：加入動態戰鬥背景 -->
    <div id="screen-single" class="screen boss-arena" style="transition: all 0.5s;">
        <div class="box status-bar" style="width: 100%; max-width: 600px; margin-bottom: 10px; position: relative;">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                <span style="color: #e53935;">❤️ 血量: <span id="player-hp">500</span></span>
                <span style="color: #4CAF50;">⭐ 分數: <span id="player-score">0</span></span>
                <span style="color: #1976D2;">⏱️ 倒數: <span id="question-timer">10</span>s</span>
            </div>
            <h3 id="combo-text" style="color: #FF5722; display: none; margin: 5px 0 0 0; text-shadow: 0 0 10px #FFC107;">🔥 連擊 x<span id="combo-count">0</span>! 傷害加倍!</h3>
        </div>

        <div class="box" style="width: 100%; max-width: 600px; position: relative;" id="boss-container">
            <div style="text-align: center; margin-bottom: 15px;">
                <div id="boss-avatar" style="font-size: 5rem; filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));">👾</div>
                <h3 style="margin: 5px 0; color: #673AB7;">病魔血量: <span id="boss-hp-text">1000</span></h3>
                <div class="hp-bar-bg" style="width: 100%; height: 20px; border-radius: 10px; overflow: hidden; background: #ffebee;">
                    <div id="boss-hp-bar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #9C27B0, #E040FB); transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);"></div>
                </div>
            </div>
            <h2 id="boss-question" style="font-size: 1.3rem;">準備好迎戰病魔了嗎？</h2>
            <div id="options-area" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;"></div>
        </div>
        <button class="btn back" onclick="forceEndGame()" style="margin-top: 15px; background: rgba(0,0,0,0.5);">逃離戰場</button>
    </div>

    <div id="screen-leaderboard" class="screen">
        <h2>🏆 榮譽榜</h2>
        <div class="menu-grid" style="max-width: 800px; text-align: left;">
            <div class="box" style="width: 100%;"><h3>👑 本班前 10 名 (<span id="lb-class-name"></span>)</h3><ol id="class-leaderboard"></ol></div>
            <div class="box" style="width: 100%;"><h3>🌟 全級前 20 名</h3><ol id="grade-leaderboard"></ol></div>
        </div>
        <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
    </div>

    <div id="screen-teacher" class="screen">
        <h2>⚙️ 老師專區</h2>
        <div class="box">
            <button class="btn primary" onclick="exportToCSV()">📊 下載紀錄 (CSV)</button>
            <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
