<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>營養素大亂鬥 Nutrient Brawl</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1 style="font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">🦠 營養素大亂鬥</h1>
        <div class="box">
            <h3>請輸入你的身分</h3>
            <select id="login-class">
                <!-- 班別將由 app.js 自動生成 -->
            </select>
            <input type="number" id="login-number" placeholder="輸入學號 (如: 15)">
            <button class="btn primary" onclick="login()">進入遊戲</button>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h1 id="welcome-text" style="font-size: 2.5rem; margin-bottom: 30px;">歡迎！</h1>
        <div class="menu-grid">
            <button class="btn boss" onclick="startSinglePlayer()">⚔️ 單人模式<br><span style="font-size: 1rem;">(病魔保衛戰)</span></button>
            <button class="btn multi" onclick="startMultiPlayer()">👯 雙人對戰<br><span style="font-size: 1rem;">(同機對抗)</span></button>
            <button class="btn info" onclick="showScreen('screen-revision'); loadRevision()">📖 溫習專區<br><span style="font-size: 1rem;">(3D 營養圖鑑)</span></button>
            <button class="btn rank" onclick="showScreen('screen-leaderboard'); loadLeaderboard()">🏆 榮譽榜<br><span style="font-size: 1rem;">(神人排名)</span></button>
        </div>
        <div id="teacher-entry" onclick="checkTeacher()">⚙️ 老師專區</div>
    </div>

    <!-- 溫習專區 -->
    <div id="screen-revision" class="screen">
        <h2>📖 3D 營養圖鑑 <span style="font-size: 1rem; font-weight: normal; color: #555;">(點擊卡片翻面)</span></h2>
        <div id="revision-content" class="revision-grid"></div>
        <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
    </div>

    <!-- 單人遊戲畫面 -->
    <div id="screen-single" class="screen boss-arena" style="transition: all 0.5s;">
        <div class="box status-bar" style="width: 100%; margin-bottom: 10px; position: relative;">
            <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold;">
                <span style="color: #e53935;">❤️ 血量: <span id="player-hp">500</span></span>
                <span style="color: #4CAF50;">⭐ 分數: <span id="player-score">0</span></span>
                <span style="color: #1976D2;">⏱️ 倒數: <span id="question-timer">10</span>s</span>
            </div>
            <h3 id="combo-text" style="color: #FF5722; display: none; margin: 5px 0 0 0; text-shadow: 0 0 10px #FFC107;">🔥 連擊 x<span id="combo-count">0</span>! 傷害加倍!</h3>
        </div>
        <div class="box" style="width: 100%; position: relative;" id="boss-container">
            <div style="text-align: center; margin-bottom: 15px;">
                <div id="boss-avatar" style="font-size: 6rem; filter: drop-shadow(0 0 10px rgba(0,0,0,0.3)); margin-bottom: 5px;">👾</div>
                <h3 style="margin: 0 0 10px 0; color: #673AB7; font-size: 1.2rem;">病魔血量: <span id="boss-hp-text">1000</span></h3>
                <div class="hp-bar-bg" style="width: 100%; height: 25px; border-radius: 15px; overflow: hidden; background: #ffebee;">
                    <div id="boss-hp-bar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #9C27B0, #E040FB); transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);"></div>
                </div>
            </div>
            <h2 id="boss-question" style="font-size: 1.4rem; padding: 10px 0;">準備好迎戰病魔了嗎？</h2>
            <div id="options-area" class="options-grid"></div>
        </div>
        <button class="btn back" onclick="forceEndGame()" style="margin-top: 15px; background: rgba(0,0,0,0.5);">逃離戰場</button>
    </div>

    <!-- 🌟 豪華版雙人分割畫面 (修正了這裡的顯示問題) -->
    <div id="screen-multi" class="screen" style="padding: 0; max-width: 100%;">
        
        <!-- Player 1 (上方，反轉 180 度) -->
        <div id="p1-zone" class="player-zone p1-theme">
            <div class="multi-header">
                <span class="multi-hp">❤️ 玩家 1 血量: <span id="p1-hp">1000</span></span>
                <button class="btn back multi-esc" onclick="forceEndMulti()">逃離</button>
            </div>
            <h3 id="p1-question" class="multi-question">讀取中...</h3>
            <div id="p1-options" class="options-grid multi-options"></div>
        </div>

        <!-- 中間分隔線與計時器 -->
        <div class="multi-divider">
            <div id="multi-timer" class="multi-timer-circle">10</div>
        </div>

        <!-- Player 2 (下方，正常顯示) -->
        <div id="p2-zone" class="player-zone p2-theme">
            <h3 id="p2-question" class="multi-question">讀取中...</h3>
            <div id="p2-options" class="options-grid multi-options"></div>
            <div class="multi-header" style="margin-top: 10px;">
                <span class="multi-hp">❤️ 玩家 2 血量: <span id="p2-hp">1000</span></span>
            </div>
        </div>

    </div>

    <!-- 榮譽榜 -->
    <div id="screen-leaderboard" class="screen">
        <h2 style="margin-bottom: 5px;">🏆 榮譽榜</h2>
        <div class="leaderboard-container">
            <div class="box rank-box">
                <h3>👑 本班前 10 名 (<span id="lb-class-name"></span>)</h3>
                <div id="class-leaderboard" class="rank-list"></div>
            </div>
            <div class="box rank-box">
                <h3>🌟 全級前 20 名</h3>
                <div id="grade-leaderboard" class="rank-list"></div>
            </div>
        </div>
        <button class="btn back" onclick="showScreen('screen-menu')" style="margin-top: 15px;">返回主選單</button>
    </div>

    <div id="screen-teacher" class="screen">
        <h2>⚙️ 老師專區</h2>
        <div class="box">
            <button class="btn primary" onclick="exportToCSV()">📊 下載紀錄 (CSV)</button>
            <button class="btn back" onclick="showScreen('screen-menu')">返回主選單</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
